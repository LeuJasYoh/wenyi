<h1 style="margin:0 0 .5em">Wenyi 前端尚未构建</h1>
<p>当前可执行文件内没有打包 WebUI 产物。请在仓库根目录运行：</p>
<p><code>make webui</code></p>
<p>该命令会构建 <code>node/ui</code> 并把产物复制到 <code>internal/webserver/static/</code>，随后重新 <code>go build</code>。</p>
<p>开发调试也可以直接指定磁盘目录：<code>set WENYI_UI_DIR=node/ui-dist</code>。</p>
</div></body></html>
